<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixlile OS - Update Center</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; padding: 20px; text-align: center; }
        .box { border: 2px solid #00ff41; padding: 20px; display: inline-block; text-align: left; background: #050505; max-width: 90%; }
        .btn { background: #00ff41; color: #000; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn:disabled { background: #333; color: #666; }
        .progress-container { display: none; margin-top: 20px; border: 1px solid #00ff41; height: 20px; }
        #bar { background: #00ff41; width: 0%; height: 100%; transition: 0.1s; }
        li { margin-bottom: 5px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h2>СИСТЕМНОЕ ОБНОВЛЕНИЕ</h2>
        <p>Текущая версия в памяти: <b id="curV">...</b></p>
        <div id="updateFound" style="display:none;">
            <p style="color: #ffff00;">Доступен пакет обновления: v1.0.5</p>
            <ul id="log"></ul>
            <button class="btn" onclick="startLoading()">УСТАНОВИТЬ / ВОССТАНОВИТЬ</button>
        </div>
        <p id="upToDate" style="display:none; color: #00ff41;">Система уже обновлена до последней версии.</p>
        
        <div class="progress-container" id="pCont">
            <div id="bar"></div>
        </div>
        <p id="pText" style="display:none;">Загрузка компонентов...</p>
    </div>
    <br><br><a href="index.html" style="color:#888; text-decoration:none;">⬅ Назад в меню</a>

    <script src="sys_core.js"></script>
    <script>
        const curV = getStoredVersion();
        document.getElementById('curV').innerText = "v" + curV;

        if (curV !== LATEST_VERSION) {
            document.getElementById('updateFound').style.display = "block";
            const logList = document.getElementById('log');
            CHANGELOG.forEach(item => {
                const li = document.createElement('li');
                li.innerText = "- " + item;
                logList.appendChild(li);
            });
        } else {
            document.getElementById('upToDate').style.display = "block";
        }

        function startLoading() {
            document.getElementById('updateFound').style.display = "none";
            document.getElementById('pCont').style.display = "block";
            document.getElementById('pText').style.display = "block";
            let p = 0;
            const interval = setInterval(() => {
                p += 2;
                document.getElementById('bar').style.width = p + "%";
                if (p >= 100) {
                    clearInterval(interval);
                    installUpdate();
                    alert("Обновление v1.0.5 успешно установлено!");
                    window.location.href = "index.html";
                }
            }, 50);
        }
    </script>
</body>
</html>
