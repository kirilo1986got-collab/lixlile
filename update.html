<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixlile OS Update</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: monospace; padding: 20px; }
        .update-container { border: 1px solid #00ff41; padding: 20px; max-width: 500px; margin: auto; background: #0a0a0a; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.9rem; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { color: #fff; background: #111; }
        .btn { background: #00ff41; color: #000; border: none; padding: 15px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn:active { transform: scale(0.98); }
        .status-bar { height: 5px; background: #222; margin-top: 10px; display: none; }
        .progress { height: 100%; background: #00ff41; width: 0%; }
    </style>
</head>
<body>
    <div class="update-container">
        <h2>ЦЕНТР ОБНОВЛЕНИЯ СИСТЕМЫ</h2>
        <p>Текущая версия: <span id="curV"></span></p>
        
        <table id="changeTable">
            <thead>
                <tr>
                    <th>Модуль</th>
                    <th>Изменение</th>
                </tr>
            </thead>
            <tbody id="changeList"></tbody>
        </table>

        <button class="btn" id="upBtn" onclick="runUpdate()">УСТАНОВИТЬ ОБНОВЛЕНИЕ v1.0.5</button>
        <div class="status-bar" id="sBar"><div class="progress" id="pBar"></div></div>
    </div>
    <p style="text-align:center"><a href="index.html" style="color:#555">Вернуться назад</a></p>

    <script src="sys_core.js"></script>
    <script>
        const current = getLocalVersion();
        document.getElementById('curV').innerText = "v" + current;

        // Заполняем таблицу реальными данными
        const tbody = document.getElementById('changeList');
        SYSTEM_CHANGES.forEach(item => {
            const row = `<tr><td>${item.module}</td><td>${item.desc}</td></tr>`;
            tbody.innerHTML += row;
        });

        if(current === LATEST_VERSION) {
            document.getElementById('upBtn').innerText = "СИСТЕМА ОБНОВЛЕНА";
            document.getElementById('upBtn').disabled = true;
        }

        function runUpdate() {
            document.getElementById('upBtn').style.display = 'none';
            document.getElementById('sBar').style.display = 'block';
            let p = 0;
            const int = setInterval(() => {
                p += 5;
                document.getElementById('pBar').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(int);
                    setLocalVersion(LATEST_VERSION);
                    alert("Версия 1.0.5 успешно активирована!");
                    window.location.href = "index.html";
                }
            }, 100);
        }
    </script>
</body>
</html>
