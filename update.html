<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixlile Update Center</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: monospace; padding: 20px; text-align: center; }
        .box { border: 1px solid #00ff41; padding: 20px; display: inline-block; margin-top: 50px; text-align: left; }
        .btn { background: #00ff41; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .log { font-size: 0.8rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Центр управления обновлениями</h2>
        <p id="curVer">Текущая версия в системе: v...</p>
        <div id="newStuff">
            <b>Список изменений v1.0.5:</b>
            <ul id="changelogList"></ul>
        </div>
        <p id="status">Система в актуальном состоянии.</p>
        <button class="btn" onclick="location.reload()">ПРОВЕРИТЬ ЕЩЕ РАЗ</button>
    </div>
    <br><br><a href="index.html" style="color:#00ff41">Назад в меню</a>

    <script src="version.js?v=1.0.5"></script>
    <script>
        document.getElementById('curVer').innerText = "Текущая версия в системе: v" + LIXLILE_CONFIG.version;
        const list = document.getElementById('changelogList');
        LIXLILE_CONFIG.changelog.forEach(item => {
            const li = document.createElement('li');
            li.innerText = item;
            list.appendChild(li);
        });
    </script>
</body>
</html>
