<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crusys OS v2.0 - Update Center</title>
    <style>
        body { background: #0a0a0a; color: #0f8; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* Меню обновлений (Установщик) */
        #update-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .installer-box {
            width: 80%; max-width: 500px; border: 2px solid #0f8; padding: 30px; border-radius: 10px; background: #111;
        }
        .progress-bar { width: 100%; height: 20px; border: 1px solid #0f8; margin-top: 20px; position: relative; }
        #progress-fill { width: 0%; height: 100%; background: #0f8; transition: 0.3s; }
        .log-text { font-size: 0.8rem; color: #aaa; margin-top: 10px; height: 40px; }
        .btn-install { background: #0f8; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        /* Основной контент */
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; opacity: 0.3; transition: 1s; filter: blur(5px); }
        .active-system { opacity: 1 !important; filter: blur(0) !important; }
        .card { background: #1a1a1a; border: 1px solid #0f8; border-radius: 15px; padding: 20px; width: 300px; }
        
        /* Калькулятор и игры */
        #display { width: 100%; height: 50px; background: #000; color: #0f8; border: 1px solid #0f8; font-size: 1.5rem; text-align: right; margin-bottom: 10px; padding: 5px; box-sizing: border-box; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { background: #222; color: #0f8; border: 1px solid #0f8; padding: 15px; cursor: pointer; }
        #rocket { font-size: 40px; position: relative; cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>

    <div id="update-menu">
        <div class="installer-box">
            <h2>CRUSYS INSTALLER v2.0</h2>
            <p>Обнаружен новый пакет изменений:</p>
            <ul style="text-align: left; font-size: 0.9rem;">
                <li>+ Модуль Core Calculator</li>
                <li>+ Движок Rocket Hunt</li>
                <li>+ Система Hacker Clicker</li>
                <li>+ Оптимизация под Termux</li>
            </ul>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <div id="status-log" class="log-text">Ожидание запуска...</div>
            <button id="install-btn" class="btn-install" onclick="startUpdate()">УСТАНОВИТЬ ОБНОВЛЕНИЯ</button>
        </div>
    </div>

    <div id="main-content" class="container">
        <div class="card">
            <h3>CLICKER</h3>
            <div id="clicks" style="font-size: 2rem;">0</div>
            <button onclick="clicker()" style="width:100%; background:#0f8; color:#000">КЛИК</button>
        </div>

        <div class="card">
            <h3>CALC</h3>
            <input id="display" readonly value="0">
            <div class="calc-grid">
                <button onclick="cl()">C</button><button onclick="ad('/')">/</button><button onclick="ad('*')">*</button><button onclick="ad('-')">-</button>
                <button onclick="ad('7')">7</button><button onclick="ad('8')">8</button><button onclick="ad('9')">9</button><button onclick="ad('+')">+</button>
                <button onclick="res()" style="grid-column: span 2; background:#0f8; color:#000">=</button>
                <button onclick="ad('0')" style="grid-column: span 2">0</button>
            </div>
        </div>

        <div class="card">
            <h3>ROCKET</h3>
            <div id="rocket" onclick="fly()">🚀</div>
        </div>
    </div>
<script>
        // ЛОГИКА УСТАНОВЩИКА
        function startUpdate() {
            const btn = document.getElementById('install-btn');
            const fill = document.getElementById('progress-fill');
            const log = document.getElementById('status-log');
            const menu = document.getElementById('update-menu');
            const main = document.getElementById('main-content');
            
            btn.style.display = 'none';
            let progress = 0;
            const steps = [
                "Распаковка библиотек...", 
                "Интеграция калькулятора...", 
                "Запуск ракетного двигателя...", 
                "Финализация версии 2.0...", 
                "Система готова!"
            ];

            const interval = setInterval(() => {
                progress += 2;
                fill.style.width = progress + "%";
                log.innerText = steps[Math.floor(progress / 25)] || "Почти готово...";

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        menu.style.display = 'none';
                        main.classList.add('active-system');
                    }, 500);
                }
            }, 50);
        }

        // ЛОГИКА САЙТА
        let c = 0;
        function clicker() { c++; document.getElementById('clicks').innerText = c; }
        
        let d = document.getElementById('display');
        function ad(v) { if(d.value=='0') d.value=v; else d.value+=v; }
        function cl() { d.value='0'; }
        function res() { try { d.value = eval(d.value); } catch { d.value='Err'; } }

        function fly() {
            const r = document.getElementById('rocket');
            r.style.left = Math.random() * 100 + 'px';
            r.style.top = Math.random() * 50 + 'px';
        }
    </script>
</body>
</html>
