<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crusys Pro Clicker 💎</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a2e; color: white; margin: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .score-container { font-size: 3rem; font-weight: bold; color: #00d2ff; text-shadow: 0 0 20px #00d2ff; }
        .coin { width: 180px; height: 180px; background: linear-gradient(45deg, #00d2ff, #3a7bd5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 4rem; cursor: pointer; transition: transform 0.1s; border: 5px solid #fff; box-shadow: 0 0 30px rgba(0,210,255,0.5); user-select: none; }
        .coin:active { transform: scale(0.9); }
        .shop { margin-top: 20px; display: grid; gap: 10px; }
        .shop-btn { background: #16213e; color: white; border: 1px solid #00d2ff; padding: 10px; border-radius: 10px; cursor: pointer; }
        .shop-btn:disabled { opacity: 0.5; }
        .back-btn { margin-top: 20px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="score-container">💎 <span id="score">0</span></div>
    <p id="stats">Клик: +1 | Авто: 0/сек</p>
    <div class="coin" id="clickBtn">💠</div>
    <div class="shop">
        <button class="shop-btn" id="upgradeClick">Улучшить клик (50💎)</button>
        <button class="shop-btn" id="upgradeAuto">Авто-майнер (150💎)</button>
    </div>
    <a href="index.html" class="back-btn">⬅ Назад</a>
    <script>
        let score = parseInt(localStorage.getItem('c_score')) || 0;
        let power = parseInt(localStorage.getItem('c_power')) || 1;
        let auto = parseInt(localStorage.getItem('c_auto')) || 0;
        const scoreEl = document.getElementById('score');
        const statsEl = document.getElementById('stats');

        function update() {
            scoreEl.innerText = Math.floor(score);
            statsEl.innerText = "Клик: +" + power + " | Авто: " + auto + "/сек";
            document.getElementById('upgradeClick').disabled = score < (power * 50);
            document.getElementById('upgradeAuto').disabled = score < 150;
        }

        document.getElementById('clickBtn').addEventListener('pointerdown', () => { score += power; update(); });
        document.getElementById('upgradeClick').addEventListener('click', () => { if(score >= power*50){ score -= power*50; power++; update(); } });
        document.getElementById('upgradeAuto').addEventListener('click', () => { if(score >= 150){ score -= 150; auto++; update(); } });

        setInterval(() => { if(auto > 0){ score += auto/10; update(); } }, 100);
        setInterval(() => { localStorage.setItem('c_score', score); localStorage.setItem('c_power', power); localStorage.setItem('c_auto', auto); }, 2000);
        update();
    </script>
</body>
</html>
