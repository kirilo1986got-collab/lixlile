<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ликсель Калькулятор</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .calc-body { border: 2px solid #333; padding: 20px; border-radius: 10px; background-color: #f4f4f4; }
        #display { width: 100%; height: 40px; text-align: right; margin-bottom: 10px; font-size: 20px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 50px); gap: 10px; }
        button { height: 50px; font-size: 18px; cursor: pointer; }
        .operator { background-color: #f90; color: white; border: none; }
        .equals { background-color: #3c3; color: white; border: none; grid-column: span 2; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html"><button><h3>Назад у меню</h3></button></a>
    </nav>

<div class="calc-body">
    <!-- Дисплей -->
    <input type="text" id="display" readonly>
    
    <!-- Кнопки -->
    <div class="buttons">
        <button onclick="clearDisplay()">C</button>
        <button onclick="appendToDisplay('/')">/</button>
        <button onclick="appendToDisplay('*')">*</button>
        <button onclick="deleteLast()">⌫</button>
        
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('-')">-</button>
        
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('+')">+</button>
        
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="calculateResult()" class="equals">=</button>
        
        <button onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendToDisplay('.')">.</button>
    </div>
</div>

<script>
    // JS логика
    let display = document.getElementById('display');

    function appendToDisplay(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
        try {
            // eval() вычисляет строковое выражение
            display.value = eval(display.value);
        } catch (error) {
            display.value = 'Ошибка';
        }
    }
</script>

</body>
</html>
